<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Figure 3 — portfolio sequence</title>
<style>
  html, body { margin: 0; padding: 0; background: #111111; font-family: Arial, Helvetica, sans-serif; }
  .page { position: relative; width: 1400px; height: 820px; background: #111111; overflow: hidden; }
  h1 { position: absolute; left: 0; right: 0; top: 12px; margin: 0; text-align: center; font-size: 24px; font-weight: 700; color: #fff; }
  .node { position: absolute; width: 150px; text-align: center; }
  .node img { width: 64px; height: 64px; display: block; margin: 0 auto 6px auto; }
  .node .name { font-size: 12px; font-weight: 700; color: #fff; line-height: 1.2; }
  svg.wires { position: absolute; left: 0; top: 0; width: 1400px; height: 820px; pointer-events: none; }
  .caption { position: absolute; left: 24px; right: 24px; bottom: 12px; text-align: center; font-size: 11px; color: #9a9a9a; }
</style>
</head>
<body>
<div class="page">
  <h1>OpenPortfo — View portfolio and refresh prices</h1>

  <div class="node" style="left:70px;top:58px;">
    <img src="user.png" alt="Browser" />
    <div class="name">Browser</div>
  </div>
  <div class="node" style="left:330px;top:52px;">
    <img src="apigateway.svg" alt="API Gateway" />
    <div class="name">Amazon API Gateway</div>
  </div>
  <div class="node" style="left:600px;top:52px;">
    <img src="eb.svg" alt="Beanstalk" />
    <div class="name">Elastic Beanstalk</div>
  </div>
  <div class="node" style="left:880px;top:52px;">
    <img src="dynamodb.svg" alt="DynamoDB" />
    <div class="name">Amazon DynamoDB</div>
  </div>
  <div class="node" style="left:1120px;top:48px;">
    <img src="coingecko.png" alt="CoinGecko" style="width:48px;height:48px;display:inline-block;margin:0 4px 6px 0;" />
    <img src="vnstock.png" alt="vnstock" style="width:48px;height:48px;display:inline-block;margin:0 0 6px 0;" />
    <div class="name">CoinGecko / vnstock</div>
  </div>

  <svg class="wires" viewBox="0 0 1400 820">
    <defs>
      <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#7EB6FF"/>
      </marker>
    </defs>
    <!-- lifelines: icon centres x = 145, 405, 675, 955, 1235 -->
    <line x1="145" y1="150" x2="145" y2="760" stroke="#3a3a3a" stroke-width="1.4"/>
    <line x1="405" y1="150" x2="405" y2="760" stroke="#3a3a3a" stroke-width="1.4"/>
    <line x1="675" y1="150" x2="675" y2="760" stroke="#3a3a3a" stroke-width="1.4"/>
    <line x1="955" y1="150" x2="955" y2="760" stroke="#3a3a3a" stroke-width="1.4"/>
    <line x1="1235" y1="150" x2="1235" y2="760" stroke="#3a3a3a" stroke-width="1.4"/>

    <!-- 1 Browser → Gateway -->
    <line x1="145" y1="190" x2="405" y2="190" stroke="#7EB6FF" stroke-width="1.7" marker-end="url(#b)"/>
    <text x="275" y="182" fill="#dedede" font-size="12" font-family="Arial" text-anchor="middle">1. GET /api/portfolio (Bearer Cognito JWT)</text>

    <!-- 2 Gateway → FastAPI -->
    <line x1="405" y1="246" x2="675" y2="246" stroke="#7EB6FF" stroke-width="1.7" marker-end="url(#b)"/>
    <text x="540" y="238" fill="#dedede" font-size="12" font-family="Arial" text-anchor="middle">2. HTTP_PROXY to FastAPI</text>

    <!-- 3 FastAPI → DynamoDB -->
    <line x1="675" y1="302" x2="955" y2="302" stroke="#7EB6FF" stroke-width="1.7" marker-end="url(#b)"/>
    <text x="815" y="294" fill="#dedede" font-size="12" font-family="Arial" text-anchor="middle">3. Verify JWT (Cognito JWKS), load holdings</text>

    <!-- 4 FastAPI → DynamoDB -->
    <line x1="675" y1="358" x2="955" y2="358" stroke="#7EB6FF" stroke-width="1.7" marker-end="url(#b)"/>
    <text x="815" y="350" fill="#dedede" font-size="12" font-family="Arial" text-anchor="middle">4. Read PriceCache (+ stored FX rates)</text>

    <!-- 5 FastAPI → markets -->
    <line x1="675" y1="414" x2="1235" y2="414" stroke="#7EB6FF" stroke-width="1.7" marker-end="url(#b)"/>
    <text x="955" y="406" fill="#dedede" font-size="12" font-family="Arial" text-anchor="middle">5. If cache miss: fetch live quotes</text>

    <!-- 6 FastAPI → DynamoDB -->
    <line x1="675" y1="470" x2="955" y2="470" stroke="#7EB6FF" stroke-width="1.7" marker-end="url(#b)"/>
    <text x="815" y="462" fill="#dedede" font-size="12" font-family="Arial" text-anchor="middle">6. Write last good prices back to cache</text>

    <!-- 7 self on FastAPI -->
    <path d="M 675 516 H 780 V 548 H 675" fill="none" stroke="#7EB6FF" stroke-width="1.7" marker-end="url(#b)"/>
    <text x="790" y="540" fill="#dedede" font-size="12" font-family="Arial" text-anchor="start">7. Compute value, cost, PnL, allocation JSON</text>

    <!-- 8 FastAPI → Browser -->
    <line x1="675" y1="604" x2="145" y2="604" stroke="#7EB6FF" stroke-width="1.7" marker-end="url(#b)"/>
    <text x="410" y="596" fill="#dedede" font-size="12" font-family="Arial" text-anchor="middle">8. JSON response for tables and pie chart</text>

    <!-- 9 Browser → Gateway -->
    <line x1="145" y1="660" x2="405" y2="660" stroke="#7EB6FF" stroke-width="1.7" marker-end="url(#b)"/>
    <text x="275" y="652" fill="#dedede" font-size="12" font-family="Arial" text-anchor="middle">9. POST /api/portfolio/refresh</text>

    <!-- 10 FastAPI → markets -->
    <line x1="675" y1="716" x2="1235" y2="716" stroke="#7EB6FF" stroke-width="1.7" marker-end="url(#b)"/>
    <text x="955" y="708" fill="#dedede" font-size="12" font-family="Arial" text-anchor="middle">10. Force-fetch CoinGecko + vnstock, then same JSON</text>
  </svg>

  <div class="caption">Figure 3 · FX is not fetched on this path. Portfolio conversion uses the last admin-refreshed rates in DynamoDB.</div>
</div>
</body>
</html>
